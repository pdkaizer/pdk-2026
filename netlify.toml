[build]
  command = "npm run build"
  publish = "_site"

# Link headers for agent discovery (RFC 8288)
[[headers]]
  for = "/"
  [headers.values]
    Link = '</feed.xml>; rel="alternate"; type="application/rss+xml"; title="Peter Kaizer", </about/>; rel="author"'

# Agent discovery manifests: readable from any origin
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
